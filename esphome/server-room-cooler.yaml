# Server room cooling — ESP32 + 2x Noctua NF-A15 HS-PWM (intake + exhaust) + 3x DS18B20
#
# Hardware
#   MCU        : ESP32 DevKit (Elegoo, micro-USB, 38-pin)
#   Fans       : Noctua NF-A15 HS-PWM chromax.black.swap, 12 V / 0.13 A / 1.56 W each
#   Sensors    : 3x DS18B20 on one 1-Wire bus (single 4.7 kOhm pull-up to 3V3)
#   Power      : 12 V / >=1 A PSU -> fans directly; 12 V -> Mini360 buck -> 5 V -> ESP32 VIN
#                All grounds common (PSU GND = ESP32 GND = fan GND).
#
# Pinout (avoids ESP32 strapping pins 0/2/12/15 and input-only 34-39)
#   GPIO25  fan IN  PWM  -> intake fan  pin 4 (blue)
#   GPIO26  fan OUT PWM  -> exhaust fan pin 4 (blue)
#   GPIO32  fan IN  TACH <- intake fan  pin 3 (green), internal pull-up, open-drain, safe
#   GPIO33  fan OUT TACH <- exhaust fan pin 3 (green)
#   GPIO4   1-Wire data (all three DS18B20), 4.7k to 3V3
#   (GPIO21/22 left free for an optional SSD1306 OLED)
#
# Noctua PWM input is driven fine by 3.3 V push-pull at 25 kHz. If a fan ever refuses to
# go below ~40% or stutters, add a 3.3->5 V level shifter on the PWM line only.

substitutions:
  device_name: server-room-cooler
  device_friendly: Server Room Cooler
  pwm_freq: "25000Hz"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret server_room_cooler_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_friendly} Fallback"
    password: !secret fallback_password

captive_portal:

# ---------------------------------------------------------------- 1-Wire bus
one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_1w

# ------------------------------------------------------------------- outputs
output:
  - platform: ledc
    id: pwm_intake
    pin: GPIO25
    frequency: ${pwm_freq}
    min_power: 0.0
    max_power: 1.0
    zero_means_zero: true
  - platform: ledc
    id: pwm_exhaust
    pin: GPIO26
    frequency: ${pwm_freq}
    min_power: 0.0
    max_power: 1.0
    zero_means_zero: true

# ------------------------------------------------------------------ controls
number:
  - platform: template
    name: "Curve Start Temp"
    id: curve_start
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 45
    step: 0.5
    initial_value: 26
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Curve Full Temp"
    id: curve_full
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 60
    step: 0.5
    initial_value: 38
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Minimum Duty"
    id: min_duty
    unit_of_measurement: "%"
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 20
    restore_value: true
    optimistic: true
    entity_category: config
  # Positive pressure: intake runs a bit harder than exhaust so air is pulled in
  # through the filtered inlet instead of every crack in the rack.
  - platform: template
    name: "Intake Offset"
    id: intake_offset
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Manual Duty"
    id: manual_duty
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 40
    restore_value: true
    optimistic: true
    entity_category: config

switch:
  - platform: template
    name: "Auto Curve"
    id: auto_curve
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# ------------------------------------------------------------------- sensors
sensor:
  # Run `esphome logs` once after flashing: ESPHome prints the address of every
  # DS18B20 it finds on the bus. Paste them below, then label the probes.
  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0x0000000000000000  # TODO: intake probe (cold aisle / room air)
    name: "Intake Temperature"
    id: t_intake
    update_interval: 10s
    filters:
      - median:
          window_size: 3
          send_every: 1

  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0x0000000000000000  # TODO: exhaust probe (hot air leaving the rack)
    name: "Exhaust Temperature"
    id: t_exhaust
    update_interval: 10s
    filters:
      - median:
          window_size: 3
          send_every: 1

  - platform: dallas_temp
    one_wire_id: bus_1w
    address: 0x0000000000000000  # TODO: probe taped to the server chassis
    name: "Server Case Temperature"
    id: t_case
    update_interval: 10s
    filters:
      - median:
          window_size: 3
          send_every: 1

  - platform: template
    name: "Delta T"
    id: t_delta
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(t_exhaust).state) || isnan(id(t_intake).state)) return NAN;
      return id(t_exhaust).state - id(t_intake).state;
    update_interval: 15s

  # Tachometer: NF-A15 emits 2 pulses per revolution.
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
    name: "Intake Fan Speed"
    id: rpm_intake
    unit_of_measurement: RPM
    accuracy_decimals: 0
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    update_interval: 10s
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
    name: "Exhaust Fan Speed"
    id: rpm_exhaust
    unit_of_measurement: RPM
    accuracy_decimals: 0
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    update_interval: 10s
    filters:
      - multiply: 0.5

  - platform: template
    name: "Intake Duty"
    id: duty_intake
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
  - platform: template
    name: "Exhaust Duty"
    id: duty_exhaust
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# ----------------------------------------------------------------- fan logic
interval:
  - interval: 5s
    then:
      - lambda: |-
          float duty;                       // 0..100, exhaust reference value

          if (!id(auto_curve).state) {
            duty = id(manual_duty).state;
          } else {
            // Drive on whichever probe reads hottest: a dead probe must never
            // let the room cook, so any NaN means full speed.
            float hot = NAN;
            if (!isnan(id(t_case).state))    hot = id(t_case).state;
            if (!isnan(id(t_exhaust).state)) hot = isnan(hot) ? id(t_exhaust).state
                                                             : max(hot, id(t_exhaust).state);
            if (isnan(hot) || isnan(id(t_case).state) || isnan(id(t_exhaust).state)) {
              duty = 100.0;                 // sensor failure -> failsafe
            } else {
              float lo = id(curve_start).state;
              float hi = id(curve_full).state;
              if (hi <= lo) hi = lo + 1.0;
              float k = (hot - lo) / (hi - lo);
              if (k <= 0.0) {
                duty = id(min_duty).state;
              } else if (k >= 1.0) {
                duty = 100.0;
              } else {
                duty = id(min_duty).state + k * (100.0 - id(min_duty).state);
              }
            }
          }

          float d_out = duty;
          float d_in  = duty + id(intake_offset).state;   // positive pressure
          d_out = max(0.0f, min(100.0f, d_out));
          d_in  = max(0.0f, min(100.0f, d_in));

          id(pwm_exhaust).set_level(d_out / 100.0f);
          id(pwm_intake).set_level(d_in / 100.0f);
          id(duty_exhaust).publish_state(d_out);
          id(duty_intake).publish_state(d_in);
